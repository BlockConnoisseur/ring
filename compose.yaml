x-ring: &ring
  image: ring-local
  build: .
  restart: unless-stopped
  env_file: .env.local
  environment: &ring-env
    RING_DB_PATH: /data/ring.sqlite
    VOICE_HOST: 0.0.0.0
  volumes:
    - ring-data:/data
services:
  web:
    <<: *ring
    command: npm start
    environment:
      <<: *ring-env
      TURNKEY_API_PRIVATE_KEY: ""
  voice:
    <<: *ring
    command: npm run voice
    environment:
      <<: *ring-env
      TURNKEY_API_PRIVATE_KEY: ""
  executor:
    <<: *ring
    command: npm run execute
  questions:
    <<: *ring
    command: npm run questions:worker
    environment:
      <<: *ring-env
      TURNKEY_API_PRIVATE_KEY: ""
  proxy:
    image: caddy:2
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    env_file: .env.local
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
    depends_on: [web, voice]
volumes:
  ring-data:
  caddy-data:
